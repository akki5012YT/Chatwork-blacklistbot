services:
  chatwork-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatwork-guardian-bot
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CHATWORK_API_TOKEN=${CHATWORK_API_TOKEN:-}
      - CHATWORK_WEBHOOK_TOKEN=${CHATWORK_WEBHOOK_TOKEN:-}
      - CHATWORK_ROOM_ID=${CHATWORK_ROOM_ID:-}
      - AUTO_KICK_ENABLED=${AUTO_KICK_ENABLED:-true}
      - AUTO_REJECT_ENABLED=${AUTO_REJECT_ENABLED:-true}
      - POLLING_INTERVAL_SECONDS=${POLLING_INTERVAL_SECONDS:-20}
      - DATABASE_URL=postgresql://bot_user:bot_password@postgres:5432/chatwork_bot
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: chatwork-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: bot_password
      POSTGRES_DB: chatwork_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user -d chatwork_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
